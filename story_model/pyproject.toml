[project]
name = "story_model"
version = "0.1.0"
description = "Typed world model and consistency checker for story-driven escape rooms"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["story_model"]
