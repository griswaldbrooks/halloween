name: Story Model

on:
  push:
    branches: [ main, master ]
    paths: [ 'story_model/**', '.github/workflows/story-model.yml' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'story_model/**', '.github/workflows/story-model.yml' ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./story_model
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.5.1
        with:
          pixi-version: latest
          run-install: false

      - name: Install
        run: pixi install

      - name: Lint
        run: pixi run lint

      - name: Test with coverage
        run: pixi run coverage

      - name: Check the Ashby fixture (known errors, report only)
        run: pixi run check-all || true
